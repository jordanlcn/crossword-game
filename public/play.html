<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crossword</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="topbar"><img class="logo" src="five9-logo-white.svg" alt="Five9">
  <div><b id="team"></b><div class="who" id="who"></div></div>
  <div class="grow"></div>
  <div class="timer" id="timer">00:00:00</div>
  <div class="grow"></div>
  <div class="score">Score: <span id="score">0</span> / <span id="total">60</span></div>
</div>
<div class="layout">
  <div class="gridwrap"><div id="zoom"></div><div class="gridscroll" id="scroll"><div id="grid"></div></div></div>
  <div class="side">
    <div class="curclue" id="cur">Click a square to begin.</div>
    <div class="panel clues" id="clues"></div>
  </div>
</div>
<input id="kb" style="position:fixed;left:-100px;top:0;width:10px;opacity:0" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false">
<script src="common.js"></script>
<script>
const me = JSON.parse(localStorage.getItem('xw_player') || 'null');
if (!me) location.href = 'index.html';
$('#zoom').append(zoomBar());
let puzzle, grid, clues, conn, offset = 0, startedAt = null, stopAt = null, ended = false, solved = {};
let sel = { id: null, key: null };
const checking = new Set();

function entry(id) { return grid.byId.get(id); }
function entriesAt(k) { return grid.cells.get(k).entries.map(entry); }
function pickAt(k, preferToggle) {
  const es = entriesAt(k);
  const cur = sel.id != null ? entry(sel.id) : null;
  let e;
  if (preferToggle && k === sel.key && es.length > 1) e = es.find((x) => x.id !== sel.id);
  else if (cur && es.some((x) => x.id === cur.id)) e = cur;
  else e = es.find((x) => x.dir === (cur ? cur.dir : 'A')) || es[0];
  select(e.id, k);
}
function select(id, key) {
  const e = entry(id);
  sel = { id, key: key || entryCells(e).find((k) => !grid.cells.get(k).ch) || entryCells(e)[0] };
  grid.highlight(id, sel.key);
  clues.active(id);
  $('#cur').textContent = `${e.num} ${e.dir === 'A' ? 'Across' : 'Down'}: ${e.clue} (${e.enum})`;
  grid.cells.get(sel.key).div.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  $('#kb').focus({ preventScroll: true });
}
function move(step) {
  const e = entry(sel.id), ks = entryCells(e), i = ks.indexOf(sel.key) + step;
  if (i >= 0 && i < ks.length) select(sel.id, ks[i]);
}
function arrow(dr, dc) {
  const [r, c] = sel.key.split(',').map(Number);
  const k = cellKey(r + dr, c + dc);
  if (!grid.cells.has(k)) return;
  const want = dc ? 'A' : 'D';
  const es = entriesAt(k);
  const e = es.find((x) => x.dir === want) || es[0];
  select(e.id, k);
}
const locked = (k) => grid.isSolvedCell(k);

function setCell(k, ch, send = true) {
  if (locked(k)) return;
  grid.setLetter(k, ch);
  if (send) conn.send({ t: 'cell', k, ch });
  if (ch) entriesAt(k).forEach(tryEntry);
}
function tryEntry(e) {
  if (solved[e.id]) return;
  const ks = entryCells(e);
  const text = ks.map((k) => grid.cells.get(k).ch).join('');
  if (text.length === e.len) conn.send({ t: 'answer', id: e.id, text });
}
$('#kb').addEventListener('keydown', (ev) => {
  if (ended || sel.id == null) return;
  const k = ev.key;
  if (k === 'ArrowRight') arrow(0, 1); else if (k === 'ArrowLeft') arrow(0, -1);
  else if (k === 'ArrowDown') arrow(1, 0); else if (k === 'ArrowUp') arrow(-1, 0);
  else if (k === 'Tab') { ev.preventDefault(); const all = [...grid.byId.keys()]; const i = all.indexOf(sel.id); select(all[(i + (ev.shiftKey ? all.length - 1 : 1)) % all.length]); }
  else if (k === ' ') { ev.preventDefault(); pickAt(sel.key, true); }
  else if (k === 'Backspace') {
    ev.preventDefault();
    if (grid.cells.get(sel.key).ch && !locked(sel.key)) setCell(sel.key, '');
    else { move(-1); if (!locked(sel.key)) setCell(sel.key, ''); }
  } else return;
  ev.preventDefault();
});
$('#kb').addEventListener('input', (ev) => {
  const ch = (ev.target.value.match(/[a-zA-Z]/g) || []).pop();
  ev.target.value = '';
  if (!ch || ended || sel.id == null) return;
  if (!locked(sel.key)) setCell(sel.key, ch.toUpperCase());
  move(1);
});

function tick() {
  if (!startedAt) return;
  $('#timer').textContent = fmtMs((stopAt || Date.now() + offset) - startedAt);
}
setInterval(tick, 250);

function onMsg(m) {
  if (m.t === 'init') {
    offset = m.serverNow - Date.now();
    puzzle = m.puzzle; startedAt = m.startedAt; solved = m.solved;
    $('#team').textContent = m.team; $('#who').textContent = 'Player: ' + m.player + ' • Room ' + m.room.code;
    $('#total').textContent = puzzle.entries.length;
    grid = buildGrid($('#grid'), puzzle, { onCellClick: (k) => { if (!ended) pickAt(k, true); } });
    clues = buildClues($('#clues'), puzzle, (id) => select(id));
    for (const [k, ch] of Object.entries(m.cells)) grid.setLetter(k, ch);
    for (const id of Object.keys(m.solved)) { grid.markSolved(+id); clues.done(+id, m.solved[id]); }
    $('#score').textContent = m.score;
    if (m.room.status === 'ended') return finish();
    if (m.score === puzzle.entries.length) stopAt = m.lastCorrectAt;
    const first = puzzle.entries.find((e) => !m.solved[e.id]) || puzzle.entries[0];
    select(first.id);
    tick();
  } else if (m.t === 'result') {
    const e = entry(m.id);
    if (m.ok) {
      solved[m.id] = m.answer;
      entryCells(e).forEach((k, i) => grid.setLetter(k, m.answer[i]));
      grid.markSolved(m.id); clues.done(m.id, m.answer);
      $('#score').textContent = m.score;
      if (m.score === puzzle.entries.length) { stopAt = m.lastCorrectAt; $('#cur').textContent = '🎉 You solved every word!'; }
      // a solved word may complete a crossing word
      entryCells(e).forEach((k) => entriesAt(k).forEach(tryEntry));
    } else {
      const ks = entryCells(e).map((k) => grid.cells.get(k).div);
      ks.forEach((d) => d.classList.add('wrong'));
      setTimeout(() => ks.forEach((d) => d.classList.remove('wrong')), 700);
    }
  } else if (m.t === 'ended') {
    stopAt = m.endedAt; finish();
  } else if (m.t === 'kicked') {
    ended = true; conn.stop();
    document.body.innerHTML = '<div class="center"><div class="card"><h2>Signed in elsewhere</h2><p>This team opened the game in another window, so this one was closed.</p></div></div>';
  }
}
function finish() {
  ended = true;
  $('#cur').textContent = 'The Game Master has ended the game. Loading results…';
  setTimeout(() => { location.href = 'results.html?code=' + me.code; }, 1200);
}
conn = connect('token=' + me.token, onMsg, () => { localStorage.removeItem('xw_player'); location.href = 'index.html'; });
</script></body></html>
